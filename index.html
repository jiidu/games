<style>
/* Layout: a 1998 homepage on a block-game dirt background. Flaming title, fire-bar dividers, a Linux terminal intro, stone-panel game cards, 88x31 badges. Single deliberate look in both themes. */
:root {
  --dirt: #08080b;
  --grass: #5f9e35;
  --grass-hi: #8cc63f;
  --stone: #8b8b8b;
  --stone-hi: #c6c6c6;
  --stone-lo: #4a4a4a;
  --fg: #ffffff;
  --dim: #d0d0d0;
  --hi: #ffff55;
  --ink: #000000;
  --shadow: #3f3f3f;
  --hover: #7b8fd6;
  --term-bg: #0b0b0b;
  --term-fg: #3dff5a;
  --term-dim: #1f9a33;
  --term-blue: #5c8dff;
  --font-pixel: "Press Start 2P", "Courier New", monospace;
  --font-term: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: #050507; height: 100%; margin: 0; }
body {
  background-color: var(--dirt);
  background-size: 512px 512px;
  image-rendering: pixelated;
  color: var(--fg);
  font-family: var(--font-term);
  font-size: 1.4rem;
  line-height: 1.25;
  padding-block: 0;
  margin: 0;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--hi); outline-offset: 3px; }

.bleed {
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
}
.grass {
  height: 20px;
  background: repeating-linear-gradient(90deg, var(--grass-hi) 0 8px, var(--grass) 8px 20px, var(--grass-hi) 20px 24px, var(--grass) 24px 32px);
  border-bottom: 6px solid var(--grass);
  box-shadow: 0 4px 0 rgba(0,0,0,.25);
}

.screen { width: 100%; max-width: 72rem; margin: 0 auto; position: relative; z-index: 1; padding-top: clamp(12px, 5vh, 72px); padding-bottom: clamp(.5rem, 2vh, 1.5rem); }
.goo { position: absolute; left: 0; top: env(safe-area-inset-top, 0px); width: 100%; height: 180px; pointer-events: none; z-index: 2; image-rendering: pixelated; }
h1 { background: none !important; -webkit-text-fill-color: currentColor !important; }
h1 .ch {
  display: inline-block;
  background: linear-gradient(#fff6a8 0%, #ffd000 40%, #ff7a00 75%, #d61f00 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: wave 2.6s ease-in-out infinite;
}
@keyframes wave {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-0.18em) rotate(-3deg); }
  75% { transform: translateY(0.1em) rotate(2deg); }
}
.space { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; image-rendering: pixelated; }
.embers { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; image-rendering: pixelated; }

/* Gentle motion */
@keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
.game { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
.shot { transition: transform .2s ease, box-shadow .2s ease; }
.game:hover .shot { transform: translateY(-5px); box-shadow: 0 0 0 3px var(--fg), 0 10px 0 -2px rgba(0,0,0,.45); }
.play { transition: transform .12s ease, background-color .12s ease; }
.play:hover { transform: translateY(-2px); }
.play:active { transform: translateY(1px); }
@keyframes glow { 0%, 100% { filter: drop-shadow(3px 3px 0 var(--ink)) drop-shadow(-1px -1px 0 var(--ink)) drop-shadow(0 0 0 rgba(255,140,0,0)); } 50% { filter: drop-shadow(3px 3px 0 var(--ink)) drop-shadow(-1px -1px 0 var(--ink)) drop-shadow(0 0 14px rgba(255,140,0,.55)); } }
h1 { animation: glow 3.5s ease-in-out infinite; }

/* Flaming title */
header { display: grid; justify-items: center; text-align: center; padding-top: clamp(8px, 2vw, 20px); }
.flame-title { position: relative; display: inline-block; padding: clamp(8px, 3vh, 40px) 12px 4px; }
.flame-title canvas {
  position: absolute; left: 0; right: 0; top: 0; bottom: 18%;
  width: 100%; height: 82%; image-rendering: pixelated;
}
h1 {
  position: relative;
  font-family: var(--font-pixel);
  font-weight: 400;
  font-size: clamp(1.3rem, 6vw, 3.4rem);
  line-height: 1.2;
  margin: 0;
  color: var(--hi);
  background: linear-gradient(#fff6a8 0%, #ffd000 40%, #ff7a00 75%, #d61f00 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(3px 3px 0 var(--ink)) drop-shadow(-1px -1px 0 var(--ink));
}
h1 .tld { font-size: .5em; }
.splash {
  font-family: var(--font-pixel);
  font-size: .75rem;
  color: var(--hi);
  text-shadow: 2px 2px 0 #3f3f15;
  transform: rotate(-6deg);
  animation: pulse 1s ease-in-out infinite alternate;
  margin: .9rem 0 0;
}
@keyframes pulse { to { transform: rotate(-6deg) scale(1.08); } }

/* Fire bar divider, like the old animated <hr> gifs */
.firebar { display: block; width: 100%; height: 34px; image-rendering: pixelated; margin-block: 1.25rem; }

/* Terminal */
.term {
  margin-top: 1.75rem !important;
  background: var(--term-bg);
  border: 3px solid var(--stone-hi);
  box-shadow: 6px 6px 0 var(--ink);
  max-width: 44rem;
  margin: 0 auto 2rem;
  font-family: var(--font-term);
}
.term-bar {
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  background: var(--stone-hi); color: var(--ink);
  font-size: 1.1rem; padding: .1rem .5rem;
}
.term-bar span:last-child { letter-spacing: .3em; }
.term pre {
  margin: 0; padding: .8rem 1rem 1rem;
  font: inherit; font-size: 1.35rem; line-height: 1.2;
  color: var(--term-fg);
  white-space: pre-wrap; word-break: break-word;
  text-shadow: 0 0 6px rgba(61, 255, 90, .45);
}
.term .p { color: var(--term-dim); }
.term .d { color: var(--term-blue); text-shadow: 0 0 6px rgba(92, 141, 255, .45); }
.term a { text-decoration: none; }
.term a:hover { text-decoration: underline; }
.cursor { display: inline-block; width: .55em; height: 1em; background: var(--term-fg); vertical-align: -0.15em; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* Games panel */
.panel {
  --pad: clamp(16px, 3vw, 32px);
  background: rgba(6, 9, 7, .92);
  border: 1px solid var(--term-dim);
  box-shadow: 0 0 0 1px var(--ink), 0 0 40px -10px rgba(61, 255, 90, .25);
  padding: 0 var(--pad) var(--pad);
}
.panel-title {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  font-family: var(--font-term); font-size: 1.2rem;
  margin: 0 calc(-1 * var(--pad)) clamp(.6rem, 1.8vh, 1.1rem);
  background: #142016; color: var(--term-dim); border-bottom: 1px solid var(--term-dim);
  padding: .2rem .8rem;
}
.panel-title .dots { display: flex; gap: 6px; }
.panel-title .dots i { width: 10px; height: 10px; display: block; background: #24502d; }
.panel-title .dots i:first-child { background: var(--term-dim); }
.prompt { margin: 0; font-family: var(--font-term); font-size: 1.4rem; color: var(--term-fg); text-shadow: 0 0 6px rgba(61, 255, 90, .45); }
.prompt .u { color: var(--term-dim); }
.prompt .path { color: #6fd0ff; text-shadow: 0 0 6px rgba(111, 208, 255, .4); }
.prompt-ls { margin-bottom: clamp(.6rem, 1.8vh, 1.1rem); }
.prompt-end { margin-top: clamp(.6rem, 1.8vh, 1.1rem); }
/* faint CRT scanlines */
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 6;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px); }
.tagline {
  width: fit-content; max-width: 100%; margin: clamp(.4rem, 1.5vh, 1.1rem) auto clamp(.6rem, 2.5vh, 1.5rem);
  font-family: var(--font-term); font-size: 1.4rem;
  background: var(--term-bg); color: var(--term-fg); border: 2px solid var(--term-dim);
  box-shadow: 4px 4px 0 var(--ink);
  padding: .3rem .9rem; text-shadow: 0 0 6px rgba(61, 255, 90, .45);
}
.tagline .p { color: var(--term-dim); }
.tagline .path { color: #6fd0ff; }
.games {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 31rem), 1fr));
  gap: 1.5rem 2rem;
}
.game { display: grid; grid-template-columns: minmax(0, 13rem) minmax(0, 1fr); gap: 1.2rem; align-items: start; min-width: 0; }
.info { display: grid; gap: .45rem; min-width: 0; }
@media (max-width: 480px) { .game { grid-template-columns: minmax(0, 1fr); } }
.shot {
  display: block; aspect-ratio: 16 / 10; max-width: 100%;
  background: var(--ink); border: 1px solid var(--term-dim); box-shadow: 0 0 12px rgba(61, 255, 90, .15);
}
.shot img, .shot canvas { width: 100%; height: 100%; display: block; object-fit: cover; image-rendering: pixelated; }
.shot:hover { border-color: var(--term-fg); box-shadow: 0 0 20px rgba(61, 255, 90, .35); }
.game h2 { font-family: var(--font-pixel); font-weight: 400; font-size: 1.15rem; margin: 0; color: var(--hi); text-shadow: 0 0 8px rgba(255, 255, 85, .35); }
.game h2::after { content: "/"; color: var(--term-dim); text-shadow: none; }
.game .perm { text-shadow: none; margin: 0; font-family: var(--font-term); font-size: 1.15rem; color: #2f6b3a; }
.game p { margin: 0; max-width: 36ch; font-size: 1.4rem; line-height: 1.15; color: var(--dim); text-shadow: 2px 2px 0 var(--shadow); }
.row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-top: .2rem; }
.play {
  font-family: var(--font-term); font-size: 1.45rem; text-decoration: none;
  color: var(--ink); background: var(--term-fg); border: 1px solid var(--term-fg);
  padding: .1rem .8rem; box-shadow: 0 0 12px rgba(61, 255, 90, .4);
}
.play:hover, .play:focus-visible { background: var(--hi); border-color: var(--hi); box-shadow: 0 0 16px rgba(255, 255, 85, .5); }
.src { font-family: var(--font-term); font-size: 1.45rem; color: var(--term-fg); background: var(--term-bg); padding: .1rem .8rem; text-decoration: none; border: 1px solid var(--term-dim); }
.src:hover { background: var(--term-dim); color: var(--ink); }

/* 88x31 badges */
.badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 1.5rem; }
.b88 {
  width: 88px; height: 31px; display: grid; grid-template-columns: 26px 1fr; align-items: stretch;
  border: 1px solid var(--ink); box-shadow: inset 1px 1px 0 rgba(255,255,255,.5), inset -1px -1px 0 rgba(0,0,0,.5);
  font-family: var(--font-pixel); font-size: 6px; line-height: 1.3; text-transform: uppercase;
  overflow: hidden;
}
.b88 > :first-child { display: grid; place-items: center; font-family: var(--font-term); font-size: 20px; }
.b88 > :last-child { display: grid; align-content: center; padding: 0 3px; }
.b-linux { background: #f5c400; color: var(--ink); }
.b-linux > :first-child { background: var(--ink); color: #f5c400; }
.b-gpl { background: #a40000; color: var(--fg); }
.b-gpl > :first-child { background: var(--fg); color: #a40000; }
.b-vim { background: #1d6b1d; color: var(--fg); }
.b-vim > :first-child { background: var(--term-bg); color: var(--term-fg); }
.b-res { background: #000080; color: var(--fg); }
.b-res > :first-child { background: #c0c0c0; color: #000080; font-size: 14px; }
.b-tty { background: var(--term-bg); color: var(--term-fg); border-color: var(--term-dim); }
.b-tty > :first-child { color: var(--term-fg); }

.soon { color: var(--dim); text-align: center; margin: 1.5rem 0 0; text-shadow: 2px 2px 0 var(--shadow); }
footer {
  position: relative; z-index: 1;
  width: fit-content; max-width: 100%; margin: auto auto 0;
  text-align: center; color: var(--fg); font-size: 1.3rem;
  padding: .3rem .9rem 0;
  text-shadow: 2px 2px 0 var(--ink);
}

.fire {
  display: block; position: relative; z-index: 1;
  width: calc(100% + max(16px, env(safe-area-inset-left, 0px)) + max(16px, env(safe-area-inset-right, 0px)));
  max-width: none;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-top: 0;
  flex-shrink: 0;
  height: clamp(56px, 7vw, 84px);
  pointer-events: none; image-rendering: pixelated;
}

@media (prefers-reduced-motion: reduce) {
  .splash, .cursor, .game, h1, h1 .ch { animation: none; }
  .shot, .play { transition: none; }
  .game:hover .shot, .play:hover { transform: none; }
  .embers { display: none; }
}
</style>

<body>

<canvas class="space" id="space" aria-hidden="true"></canvas>
<canvas class="embers" id="embers" aria-hidden="true"></canvas>
<canvas class="goo" id="goo" aria-hidden="true"></canvas>
<div class="screen">
  <header>
    <div class="flame-title">
      <h1>JP's Games</h1>
    </div>
  </header>

  <p class="tagline"><span class="p">$</span> Free open source browser games</p>

  <main class="panel" style="margin-bottom: 1rem">
    <p class="panel-title"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>jp@games: /usr/games</span><span id="count"></span></p>
    <p class="prompt prompt-ls"><span class="u">jp@games</span>:<span class="path">/usr/games</span>$ ls -l</p>
    <div class="games" id="list"></div>
    <p class="prompt prompt-end"><span class="u">jp@games</span>:<span class="path">/usr/games</span>$ <span class="cursor" aria-hidden="true"></span></p>
  </main>

</div>
<footer>© 2026 JP Hakoluoto · GPL-3.0</footer>
<canvas class="fire" id="fire" aria-hidden="true"></canvas>

<script>
/* ------------------------------------------------------------
   Add a game: copy one entry and fill in the fields.
   slug: folder name shown in the terminal listing.
   screenshot: image path or URL, e.g. "img/lokichess.png".
   Leave it null to show a pixel placeholder.
   ------------------------------------------------------------ */
const GAMES = [
  {
    title: "Arkeol",
    slug: "arkeol",
    description: "An archaeology game inspired by Spelunky and Minecraft. Dig down and see what's buried.",
    play: "https://jiidu.github.io/arkeol/",
    source: "https://github.com/jiidu/arkeol",
    screenshot: null,
    placeholder: "dig"
  },
  {
    title: "LokiChess",
    slug: "lokichess",
    description: "Chess with a few twists. Play in your browser and analyse the game with Stockfish.",
    play: "https://lokichess.com",
    source: "https://github.com/jiidu/lokichess",
    screenshot: null,
    placeholder: "board"
  }
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));


document.getElementById("count").textContent = `${GAMES.length} FOUND`;

/* Game cards */
document.getElementById("list").innerHTML = GAMES.map(g => `
  <article class="game">
    <a class="shot" href="${esc(g.play)}" target="_blank" rel="noopener" aria-label="Play ${esc(g.title)}">
      ${g.screenshot
        ? `<img src="${esc(g.screenshot)}" alt="Screenshot of ${esc(g.title)}" loading="lazy">`
        : `<canvas width="64" height="40" data-kind="${esc(g.placeholder)}" aria-hidden="true"></canvas>`}
    </a>
    <div class="info">
      <h2>${esc(g.title)}</h2>
      <p>${esc(g.description)}</p>
      <div class="row">
        <a class="play" href="${esc(g.play)}" target="_blank" rel="noopener">./play</a>
        <a class="src" href="${esc(g.source)}" target="_blank" rel="noopener">git clone</a>
      </div>
    </div>
  </article>`).join("");
document.querySelectorAll(".game").forEach((el, i) => el.style.animationDelay = `${i * 120}ms`);

/* Wavy title: one span per letter, each a little behind the last */
(() => {
  const h = document.querySelector("h1");
  const text = h.textContent;
  h.setAttribute("aria-label", text);
  h.innerHTML = [...text].map((c, i) =>
    `<span class="ch" aria-hidden="true" style="animation-delay:${-i * 0.14}s">${c === " " ? "&nbsp;" : esc(c)}</span>`).join("");
})();

/* Slime dripping from the ceiling */
(() => {
  const cv = document.getElementById("goo"), x = cv.getContext("2d");
  const CELL = 4, H = 45;
  const BODY = "#6cc04a", LIGHT = "#b5f27a", DARK = "#3c7d2a";
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, band, drips;
  const newDrip = (warm) => ({
    x: 2 + Math.floor(Math.random() * (W - 4)),
    w: Math.random() < 0.4 ? 2 : 1,
    len: warm ? Math.random() * 14 : 0,
    max: 8 + Math.random() * 20,
    speed: 0.015 + Math.random() * 0.04,
    drops: 0,
    drop: null
  });
  function size() {
    W = Math.ceil(innerWidth / CELL);
    cv.width = W; cv.height = H;
    band = Array.from({ length: W }, (_, i) => Math.max(1, Math.round(3 + Math.sin(i * 0.31) * 1.2 + Math.sin(i * 0.09 + 1) * 1.1)));
    drips = Array.from({ length: Math.max(4, Math.round(W / 16)) }, () => newDrip(true));
  }
  function update() {
    drips.forEach((d, k) => {
      if (d.drop) {
        d.drop.vy += 0.035; d.drop.y += d.drop.vy;
        if (d.drop.y > H + 3) {
          d.drop = null;
          if (d.drops > 2) { drips[k] = newDrip(false); return; }
        }
      }
      d.len += d.speed * (1 + d.len / 25);
      if (d.len >= d.max) {
        d.drop = { x: d.x, w: d.w, y: band[d.x] + d.len, vy: 0.15 };
        d.len = 1;
        d.max = 8 + Math.random() * 20;
        d.drops++;
      }
    });
  }
  function draw() {
    x.clearRect(0, 0, W, H);
    for (let i = 0; i < W; i++) {
      x.fillStyle = BODY; x.fillRect(i, 0, 1, band[i]);
      x.fillStyle = DARK; x.fillRect(i, band[i], 1, 1);
    }
    x.fillStyle = LIGHT; for (let i = 0; i < W; i += 7) x.fillRect(i, 1, 2, 1);
    drips.forEach(d => {
      const top = band[d.x], L = Math.floor(d.len);
      if (L > 0) {
        x.fillStyle = BODY; x.fillRect(d.x, top, d.w, L);
        const bulb = d.len > d.max * 0.6 ? 1 : 0;
        x.fillRect(d.x - bulb, top + L - 1, d.w + bulb * 2, 2 + bulb);
        x.fillStyle = DARK; x.fillRect(d.x - bulb, top + L + 1 + bulb, d.w + bulb * 2, 1);
        x.fillStyle = LIGHT; x.fillRect(d.x, top, 1, Math.max(1, L - 2));
      }
      if (d.drop) {
        const y = Math.round(d.drop.y);
        x.fillStyle = BODY; x.fillRect(d.drop.x, y, d.w + 1, 2);
        x.fillStyle = LIGHT; x.fillRect(d.drop.x, y, 1, 1);
        x.fillStyle = DARK; x.fillRect(d.drop.x, y + 2, d.w + 1, 1);
      }
    });
  }
  size();
  draw();
  if (!still) {
    let last = 0;
    (function loop(t) {
      if (t - last > 33) { update(); draw(); last = t; }
      requestAnimationFrame(loop);
    })(0);
  }
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { size(); draw(); }, 150); });
})();

/* Embers drifting up from the fire */
(() => {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("embers"), x = cv.getContext("2d");
  const COLORS = ["#fff6a8", "#ffd000", "#ff9a00", "#ff5a00", "#d61f00"];
  let W, H, dpr, parts = [];
  function size() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(70, W / 18));
    while (parts.length < n) parts.push(spawn(true));
    parts.length = n;
  }
  function spawn(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : H + 10,
      vy: -(0.25 + Math.random() * 0.9),
      sway: 0.3 + Math.random() * 0.8,
      phase: Math.random() * Math.PI * 2,
      s: Math.random() < 0.25 ? 4 : Math.random() < 0.6 ? 3 : 2,
      life: 0,
      max: 300 + Math.random() * 500
    };
  }
  function frame() {
    x.clearRect(0, 0, W, H);
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      p.life++;
      p.y += p.vy;
      p.x += Math.sin(p.phase + p.life * 0.02) * p.sway * 0.4;
      const t = p.life / p.max;
      if (t >= 1 || p.y < -10) { parts[i] = spawn(false); continue; }
      const a = t < 0.1 ? t * 10 : 1 - (t - 0.1) / 0.9;
      x.globalAlpha = Math.max(0, a) * 0.85;
      x.fillStyle = COLORS[Math.min(COLORS.length - 1, Math.floor(t * COLORS.length))];
      x.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
    }
    x.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  size();
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(size, 150); });
  requestAnimationFrame(frame);
})();

/* Seeded random so textures look the same every visit */
let seed = 11;
const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

/* Dirt tile for the page background */
(() => {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const x = c.getContext("2d");
  const tones = ["#0a0a0d", "#0c0c10", "#0e0d13", "#26263a", "#7d7d9c"];
  for (let y = 0; y < 128; y++) for (let X = 0; X < 128; X++) {
    const r = rnd();
    x.fillStyle = tones[r < .5 ? 0 : r < .8 ? 1 : r < .985 ? 2 : r < .997 ? 3 : 4];
    x.fillRect(X, y, 1, 1);
  }
  /* Bones and a skull buried in the dirt */
  const BONE = "#4a4842", SHADE = "#302f2b", HOLE = "#08080b";
  const sprites = {
    h: ["X.......X", "XXXXXXXXX", "X.......X"],
    v: ["X.X", ".X.", ".X.", ".X.", ".X.", ".X.", ".X.", ".X.", "X.X"],
    d: ["XX.......", "XXX......", ".XX......", "...X.....", "....X....", ".....X...", "......XX.", "......XXX", ".......XX"],
    a: [".......XX", "......XXX", "......XX.", ".....X...", "....X....", "...X.....", ".XX......", "XXX......", "XX......."],
    skull: [".XXXXX.", "XXXXXXX", "XooXooX", "XXXXXXX", ".XXoXX.", ".XoXoX."]
  };
  const placed = [];
  const put = (s) => {
    const rows = sprites[s], h = rows.length, w = rows[0].length;
    for (let tries = 0; tries < 40; tries++) {
      const ox = 4 + Math.floor(rnd() * (128 - w - 8)), oy = 4 + Math.floor(rnd() * (128 - h - 8));
      if (placed.some(p => ox < p.x + p.w + 6 && ox + w + 6 > p.x && oy < p.y + p.h + 6 && oy + h + 6 > p.y)) continue;
      placed.push({ x: ox, y: oy, w, h });
      rows.forEach((row, ry) => [...row].forEach((ch, rx) => {
        if (ch === ".") return;
        x.fillStyle = ch === "o" ? HOLE : (ry === h - 1 && s !== "skull" ? SHADE : BONE);
        x.fillRect(ox + rx, oy + ry, 1, 1);
      }));
      return;
    }
  };
  document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)), url(${c.toDataURL()})`;
})();

/* Flames along the bottom of the screen: separate tongues, not a solid block */
(() => {
  const cv = document.getElementById("fire"), x = cv.getContext("2d");
  const H = 20, MAX = 36;
  const STOPS = [[0,0,0,0],[71,15,7,0],[103,31,7,200],[143,39,7,255],[175,63,7,255],[199,71,7,255],[223,87,7,255],[223,111,15,255],[215,127,15,255],[207,151,31,255],[199,175,47,255],[191,191,63,255],[223,223,111,255],[255,255,200,255]];
  const PAL = [];
  for (let i = 0; i <= MAX; i++) {
    const tt = i / MAX * (STOPS.length - 1), a = Math.floor(tt), b = Math.min(STOPS.length - 1, a + 1), f = tt - a;
    PAL.push(STOPS[a].map((v, k) => Math.round(v + (STOPS[b][k] - v) * f)));
  }
  let W, px, img, t = 0;
  function seed() {
    t += 0.05;
    for (let X = 0; X < W; X++) {
      const n = Math.sin(X * 0.5 + t) * 0.6 + Math.sin(X * 0.17 - t * 0.8) * 0.4;
      px[(H - 1) * W + X] = Math.round(MAX * (0.72 + 0.28 * n) * (0.85 + 0.15 * Math.random()));
    }
  }
  function step() {
    seed();
    for (let y = 1; y < H; y++) for (let X = 0; X < W; X++) {
      const src = y * W + X, v = px[src];
      if (v === 0) { px[src - W] = 0; continue; }
      const r = Math.floor(Math.random() * 3);
      const dst = Math.max(0, Math.min(W * H - 1, src - W + r - 1));
      const edge = (X > 0 && px[src - 1] === 0) || (X < W - 1 && px[src + 1] === 0) ? 3 : 0;
      px[dst] = Math.max(0, v - (1 + (Math.random() < 0.7 ? 1 : 0) + edge));
    }
  }
  function paint() {
    const d = img.data;
    for (let i = 0; i < px.length; i++) d.set(PAL[px[i]], i * 4);
    x.putImageData(img, 0, 0);
  }
  function size() {
    W = Math.max(32, Math.round((cv.clientWidth || 300) / (cv.clientHeight || 60) * H));
    cv.width = W; cv.height = H;
    px = new Uint8Array(W * H);
    img = x.createImageData(W, H);
    for (let i = 0; i < 40; i++) step();
    paint();
  }
  size();
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    let last = 0;
    (function loop(now) {
      if (now - last > 60) { step(); paint(); last = now; }
      requestAnimationFrame(loop);
    })(0);
  }
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(size, 150); });
})();

/* Space: twinkling stars, a ringed planet, a small moon and the odd shooting star */
(() => {
  const cv = document.getElementById("space"), x = cv.getContext("2d");
  const S = 3; // css px per space pixel
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, stars = [], shoot = null, nextShoot = 0;
  const STAR = ["#5a5a7a", "#9a9ac0", "#d8d8ff", "#ffffff", "#ffe9a8", "#a8d8ff"];
  function size() {
    W = Math.ceil(innerWidth / S); H = Math.ceil(innerHeight / S);
    cv.width = W; cv.height = H;
    let sd = 7; const r = () => (sd = (sd * 9301 + 49297) % 233280) / 233280;
    stars = Array.from({ length: Math.round(W * H / 260) }, () => ({
      x: Math.floor(r() * W), y: Math.floor(r() * H),
      c: STAR[Math.floor(r() * STAR.length)], big: r() < 0.07,
      ph: r() * Math.PI * 2, sp: 0.02 + r() * 0.05
    }));
  }
  function planet(cx, cy, R, t) {
    // ring behind
    ring(cx, cy, R, true);
    for (let y = -R; y <= R; y++) for (let X = -R; X <= R; X++) {
      const d = X * X + y * y;
      if (d > R * R) continue;
      const light = (-X * 0.6 - y * 0.8) / R + 0.35;
      const band = Math.sin((y + R) * 0.55 + Math.sin(X * 0.15 + t * 0.2) * 0.6);
      let c;
      if (light < -0.35) c = "#1d1238";
      else if (light < 0.05) c = band > 0.3 ? "#3a2470" : "#2d1b5a";
      else if (light < 0.5) c = band > 0.3 ? "#6a43c4" : "#5634a6";
      else c = band > 0.3 ? "#9c7ef0" : "#8463dc";
      if (light > 0.85 && (X + y) % 2 === 0) c = "#c9b8ff";
      x.fillStyle = c; x.fillRect(cx + X, cy + y, 1, 1);
    }
    ring(cx, cy, R, false);
  }
  function ring(cx, cy, R, back) {
    const a = R * 1.85, b = R * 0.42;
    for (let i = 0; i < 360; i++) {
      const th = i / 360 * Math.PI * 2, s = Math.sin(th);
      if (back ? s > 0 : s <= 0) continue;
      for (let k = 0; k < 3; k++) {
        const rx = Math.round(cx + Math.cos(th) * (a - k * 1.6) * 1), ry = Math.round(cy + Math.sin(th) * (b - k * 0.5) - Math.cos(th) * R * 0.18);
        x.fillStyle = k === 1 ? "#e8dcff" : "#a48ae0";
        x.globalAlpha = back ? 0.55 : 1;
        x.fillRect(rx, ry, 1, 1);
      }
    }
    x.globalAlpha = 1;
  }
  function moon(cx, cy, R) {
    for (let y = -R; y <= R; y++) for (let X = -R; X <= R; X++) {
      if (X * X + y * y > R * R) continue;
      const light = (-X - y) / R;
      x.fillStyle = light > 0.6 ? "#c8c8d8" : light > -0.2 ? "#8c8ca4" : "#3c3c50";
      x.fillRect(cx + X, cy + y, 1, 1);
    }
    x.fillStyle = "#5c5c74"; x.fillRect(cx - 1, cy, 2, 1); x.fillRect(cx + 2, cy - 2, 1, 1);
  }
  function draw(t) {
    x.clearRect(0, 0, W, H);
    stars.forEach(s => {
      const a = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(s.ph + t * s.sp));
      x.globalAlpha = a; x.fillStyle = s.c;
      x.fillRect(s.x, s.y, 1, 1);
      if (s.big && a > 0.8) { x.globalAlpha = a * 0.5; x.fillRect(s.x - 1, s.y, 3, 1); x.fillRect(s.x, s.y - 1, 1, 3); }
    });
    x.globalAlpha = 1;
    const R = Math.max(10, Math.min(26, Math.round(Math.min(W, H) * 0.09)));
    planet(Math.round(W * 0.87), Math.round(H * 0.17), R, t);
    moon(Math.round(W * 0.11), Math.round(H * 0.2), Math.max(4, Math.round(R * 0.32)));
    if (shoot) {
      for (let i = 0; i < 10; i++) {
        x.globalAlpha = (1 - i / 10) * shoot.life;
        x.fillStyle = i < 2 ? "#ffffff" : "#a8d8ff";
        x.fillRect(Math.round(shoot.x - shoot.vx * i * 0.7), Math.round(shoot.y - shoot.vy * i * 0.7), 1, 1);
      }
      x.globalAlpha = 1;
    }
  }
  size();
  draw(0);
  if (!still) {
    let last = 0, t = 0;
    (function loop(now) {
      if (now - last > 50) {
        t++;
        if (!shoot && now > nextShoot) {
          shoot = { x: Math.random() * W * 0.7, y: Math.random() * H * 0.35, vx: 2.2, vy: 0.9, life: 1 };
          nextShoot = now + 5000 + Math.random() * 7000;
        }
        if (shoot) { shoot.x += shoot.vx; shoot.y += shoot.vy; shoot.life -= 0.03; if (shoot.life <= 0) shoot = null; }
        draw(t); last = now;
      }
      requestAnimationFrame(loop);
    })(0);
  }
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { size(); draw(0); }, 150); });
})();

/* Phosphor-green pixel placeholders, drawn at 64x40 and scaled up */
const PG = ["#041a08", "#0b3a14", "#16692a", "#25a03f", "#3dff5a", "#c8ffd2"];
document.querySelectorAll("canvas[data-kind]").forEach(cv => {
  const x = cv.getContext("2d");
  const px = (c, X, Y, w = 1, h = 1) => { x.fillStyle = c; x.fillRect(X, Y, w, h); };
  px(PG[0], 0, 0, 64, 40);
  if (cv.dataset.kind === "board") {
    for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++)
      px((r + f) % 2 ? PG[1] : PG[2], 16 + f * 4, 4 + r * 4, 4, 4);
    [[1,1],[2,1],[5,1],[6,0],[3,4],[4,3]].forEach(([f, r]) => px(PG[0], 17 + f * 4, 4 + r * 4 + 1, 2, 3));
    [[1,6],[2,6],[5,6],[6,7],[4,4]].forEach(([f, r]) => px(PG[5], 17 + f * 4, 4 + r * 4 + 1, 2, 3));
    px(PG[4], 16 + 4 * 4, 4 + 4 * 4, 4, 1);
  } else {
    for (let y = 12; y < 40; y++) for (let X = 0; X < 64; X++) {
      const r = rnd();
      px(y < 14 ? PG[3] : y < 24 ? (r < .7 ? PG[1] : PG[2]) : (r < .7 ? PG[2] : PG[1]), X, y);
    }
    px(PG[0], 28, 12, 4, 18); px(PG[0], 28, 26, 16, 5);
    px(PG[5], 30, 27, 2, 2);
    px(PG[4], 46, 34, 2, 1); px(PG[4], 49, 35, 2, 1); px(PG[4], 47, 36, 2, 1);
    px(PG[5], 54, 31, 2, 2);
  }
});
</script>
